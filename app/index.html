<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio CI/CD - Equipo USI</title>
    <style>
        :root {
            --usi-purple: #5b21b6;
            --usi-purple-dark: #3b0764;
            --usi-purple-light: #ede9fe;
            --bg-white: #ffffff;
            --bg-soft: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(135deg, var(--bg-soft) 0%, var(--usi-purple-light) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: var(--bg-white);
            border-top: 6px solid var(--usi-purple);
            border-radius: 16px;
            box-shadow: 0 20px 35px -10px rgba(59, 7, 100, 0.15);
            max-width: 680px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: var(--usi-purple-light);
            color: var(--usi-purple);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            margin-bottom: 1.25rem;
        }
        h1 {
            color: var(--usi-purple-dark);
            font-size: 1.9rem;
            line-height: 1.25;
            margin-bottom: 1rem;
        }
        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .stack {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .pill {
            background: var(--bg-soft);
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--usi-purple);
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #15803d;
            background: #dcfce7;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        .dot {
            width: 10px;
            height: 10px;
            background: #16a34a;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">Despliegue de Software</span>
        
        <p>
            Integración y Entrega Continua (CI/CD) orquestada automáticamente desde GitHub
            hacia un contenedor Nginx sobre infraestructura virtualizada con Vagrant.
        </p>
        <div class="stack">
            <div class="pill">Git &amp; GitHub</div>
            <div class="pill">Jenkins CI/CD</div>
            <div class="pill">Docker Compose</div>
            <div class="pill">Vagrant VM</div>
        </div>
        <div class="status">
            <span class="dot"></span>
            Pipeline Activo • (Puerto 8081)
        </div>
    </main>
</body>
</html>
